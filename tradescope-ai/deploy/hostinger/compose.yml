# TradeScope AI on a Hostinger VPS — Docker Manager project "tradescope" (generated by scripts/hostinger.mjs).
# Self-contained: the app is built from the public GitHub repository at ref "main"; data stays in /opt/tradescope.
# Point the domain's A/AAAA records at the VPS and keep ports 80/443 open; Caddy gets the certificates.
name: tradescope
services:
  # gives the app user (uid 1001) its data folder on the host
  init-data:
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /data && chown -R 1001:1001 /data && chmod 700 /data"]
    volumes:
      - /opt/tradescope/data:/data
    restart: "no"

  app:
    build:
      context: https://github.com/mrblackfree/mrts.git#main:tradescope-ai
      args:
        NEXT_PUBLIC_SITE_URL: https://trade.xn--3e0b707e
    image: tradescope-ai:main
    pull_policy: build
    restart: unless-stopped
    depends_on:
      init-data:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_SECRET: ${ADMIN_SECRET}
    volumes:
      - /opt/tradescope/data:/app/.data
    expose:
      - "3000"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /etc/caddy/Caddyfile <<'CADDYFILE'
        trade.xn--3e0b707e {
            encode zstd gzip
            reverse_proxy app:3000
        }
        www.trade.xn--3e0b707e {
            redir https://trade.xn--3e0b707e{uri} permanent
        }
        CADDYFILE
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - /opt/tradescope/caddy/data:/data
      - /opt/tradescope/caddy/config:/config
